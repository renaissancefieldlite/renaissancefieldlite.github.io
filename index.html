<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050607" />
    <meta
        name="description"
        content="Renaissance Field Lite builds useful AI systems now while researching the architecture for super intelligence."
    />
    <meta property="og:title" content="Renaissance Field Lite — Intelligence, made real." />
    <meta
        property="og:description"
        content="AI engineering and super intelligence research for enterprise, science, and the physical world."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://renaissancefieldlite.com/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Renaissance Field Lite — Intelligence, made real." />
    <meta
        name="twitter:description"
        content="AI engineering and super intelligence research for enterprise, science, and the physical world."
    />
    <title>Renaissance Field Lite — Intelligence, made real.</title>
    <link rel="stylesheet" href="landing.css?rev=first-party-intake-1" />
    <script src="landing.js?rev=first-party-intake-1" defer></script>
</head>
<body class="intro-page">
    <a class="skip-link" href="#introduction">Skip to introduction</a>

    <canvas class="field-canvas" data-field-canvas aria-hidden="true"></canvas>
    <div class="field-shade" aria-hidden="true"></div>
    <div class="film-grain" aria-hidden="true"></div>
    <div class="entry-lattice" data-entry-lattice aria-hidden="true">
        <video
            class="entry-lattice-video"
            data-entry-lattice-video
            src="assets/rfl-entry-lattice-loop.mp4"
            playsinline
            preload="auto"
            loop
        ></video>
    </div>
    <div
        class="entry-lattice-object"
        data-entry-lattice-object
        data-lattice-source="generated-video-2-clean-loop-trimmed-075"
        aria-hidden="true"
    >
        <video
            class="entry-lattice-object-video"
            data-entry-lattice-object-video
            data-lattice-source="generated-video-2-clean-loop-trimmed-075"
            src="assets/rfl-entry-lattice-object-clean-loop.mp4"
            playsinline
            preload="auto"
            muted
            loop
        ></video>
    </div>

    <header class="site-header intro-header" aria-label="Renaissance Field Lite">
        <a class="brand" href="./" aria-label="Renaissance Field Lite home">
            <span class="brand-logo-crop">
                <img class="brand-logo" src="assets/rfl-logo-silver.png" alt="Renaissance Field Lite" />
            </span>
        </a>
        <p class="header-index" aria-hidden="true">RFL / 01</p>
    </header>

    <main class="intro-main" id="introduction">
        <div class="intro-copy">
            <h1 class="intro-title" aria-label="Intelligence, made real.">
                <span class="title-line"><span>Intelligence,</span></span>
                <span class="title-line title-line-shift"><span>made real.</span></span>
            </h1>
            <p class="intro-deck reveal-line">
                We build useful AI systems now—and research the architecture for super intelligence.
            </p>
            <a
                class="entry-link reveal-line"
                href="enter.html"
                data-entry-trigger
                data-page-transition
                aria-describedby="entry-instruction"
            >
                <span>Enter Renaissance Field Lite</span>
                <span class="entry-arrow" aria-hidden="true">↗</span>
            </a>
            <span class="sr-only" id="entry-instruction" data-entry-announcer aria-live="polite">
                Hover or focus to preview the entry experience. Activate once to enter.
            </span>
        </div>
    </main>

    <footer class="intro-footer" aria-label="Company positioning">
        <p>Strategy</p>
        <span aria-hidden="true"></span>
        <p>Engineering</p>
        <span aria-hidden="true"></span>
        <p>Optimization</p>
    </footer>
</body>
</html>
